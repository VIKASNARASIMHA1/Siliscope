# Continuous integration: builds everything from scratch and runs the complete test suite
# (110 official riscv-tests, the guest-OS self-test, demand paging / swapping / scheduler checks,
# Belady-OPT sanity checks, the cycle-by-cycle pipeline validation and the benchmark self-checks)
# on Linux and Windows. Rust unit tests (pipeline timing, page-replacement simulators) run first.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (clang + lld)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (clang + lld) and Python plotting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python3 -m pip install matplotlib
      - name: Rust unit tests
        run: cargo test --release --workspace
      - name: Full test suite
        run: bash ./rvsim.sh test
      - name: Regenerate benchmark charts
        run: bash ./rvsim.sh vmbench && bash ./rvsim.sh pipebench
      - name: Upload results (CSV + charts)
        uses: actions/upload-artifact@v4
        with:
          name: results-linux
          path: results/

  windows:
    name: Windows (PowerShell launcher)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Make sure LLVM (clang + lld) is installed
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          clang --version
      - name: Rust unit tests
        shell: pwsh
        run: cargo test --release --workspace
      - name: Full test suite via the PowerShell launcher
        shell: pwsh
        run: .\rvsim.ps1 test
